<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro - Huevos Max Campos</title>
        <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                font-family: 'Jost', sans-serif;
                background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
                color: #fff;
            }

            h2 {
                font-size: 2.5em;
                font-weight: bold;
                text-align: center;
                margin-bottom: 30px;
            }

            form {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 350px;
            }

            input, select {
                width: 100%;
                height: 20px;
                background: #e0dede;
                margin: 15px 0;
                padding: 10px;
                border: none;
                outline: none;
                border-radius: 5px;
                font-family: 'Jost', sans-serif;
                font-size: 1em;
            }

            select {
                height: 40px;
            }

            button, a.button {
                width: 100%;
                max-width: 200px;
                height: 40px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #fff;
                background: #573b8a;
                font-size: 1em;
                font-weight: bold;
                text-decoration: none;
                border: none;
                border-radius: 5px;
                transition: .2s ease-in;
                cursor: pointer;
                margin: 10px 0;
            }

            button:hover, a.button:hover {
                background: #6d44b8;
            }

            .signup-error {
                color: red;
                text-align: center;
                margin: 10px 0;
            }
        </style>
    </head>
    <body>
        <h2>Registro - Huevos Max Campos</h2>
        <form method="POST" action="{{ url_for('register_user') }}">
            <input type="text" name="numero_documento" placeholder="Número de Documento" required>
            <input type="text" name="nombre_completo" placeholder="Nombre Completo" required>
            <input type="text" name="numero_contacto" placeholder="Número de Contacto" required>
            <input type="email" name="correo" placeholder="Correo" required>
            <select name="tipo_persona" required>
                <option value="natural">Persona Natural</option>
                <option value="juridica">Persona Jurídica</option>
            </select>
            <input type="password" name="password" placeholder="Contraseña" required>
            {% if signup_error %}
                <p class="signup-error">{{ signup_error }}</p>
            {% endif %}
            <button type="submit">Registrar</button>
        </form>
        <a href="{{ url_for('login') }}" class="button">Volver</a>
    </body>
    </html>
