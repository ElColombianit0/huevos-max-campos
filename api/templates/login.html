<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huevos Max Campos</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Jost', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
        }

        h2 {
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        input {
            width: 100%;
            height: 20px;
            background: #e0dede;
            margin: 15px 0;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 5px;
            font-family: 'Jost', sans-serif;
            font-size: 1em;
        }

        button, a.button {
            width: 100%;
            max-width: 200px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background: #573b8a;
            font-size: 1em;
            font-weight: bold;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: .2s ease-in;
            cursor: pointer;
            margin: 10px 0;
        }

        button:hover, a.button:hover {
            background: #6d44b8;
        }

        .error {
            color: red;
            text-align: center;
            margin: 10px 0;
        }

        .google-signin {
            margin-top: 20px;
        }

        .g-signin2 {
            width: 200px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            const data = {
                id_token: response.credential
            };
            fetch('/google-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.error || 'Error al iniciar sesión con Google');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al iniciar sesión con Google');
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "{{ GOOGLE_CLIENT_ID }}",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("googleSignInButton"),
                { theme: "outline", size: "large" }
            );
        };
    </script>
</head>
<body>
    <h2>Huevos Max Campos</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="email" name="correo" placeholder="Correo" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <button type="submit">Iniciar Sesión</button>
    </form>
    <a href="{{ url_for('register_user') }}" class="button">Registrarme</a>
    <div class="google-signin">
        <div id="googleSignInButton" class="g-signin2"></div>
    </div>
</body>
</html>
