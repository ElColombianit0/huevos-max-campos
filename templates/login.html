<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huevos Max Campos</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Jost', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
        }

        .main {
            width: 350px;
            height: 500px;
            background: red;
            overflow: hidden;
            background: url("https://doc-08-2c-docs.googleusercontent.com/docs/securesc/68c90smiglihngpp4n8v1i9bhf2c2vq2/fo0picsp1nhiucmc0l25s5idiv9e2n3i/1631524275000/03522360960922298374/03522360960922298374/1Sx0jhdpEpnNIydS4rnN4kHSJtU1EyWka?e=view&authuser=0&nonce=gcrocepgbb17m&user=03522360960922298374&hash=tfhgbsuoq1lpp8hs3knn0b4s3mhe6k9u") no-repeat center/ cover;
            border-radius: 10px;
            box-shadow: 5px 20px 50px #000;
            position: relative;
        }

        #chk {
            display: none;
        }

        .signup {
            position: relative;
            width: 100%;
            height: 100%;
        }

        label {
            color: #fff;
            font-size: 2.3em;
            justify-content: center;
            display: flex;
            margin: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: .5s ease-in-out;
        }

        input {
            width: 60%;
            height: 20px;
            background: #e0dede;
            justify-content: center;
            display: flex;
            margin: 20px auto;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 5px;
        }

        button {
            width: 60%;
            height: 40px;
            margin: 10px auto;
            justify-content: center;
            display: block;
            color: #fff;
            background: #573b8a;
            font-size: 1em;
            font-weight: bold;
            margin-top: 20px;
            outline: none;
            border: none;
            border-radius: 5px;
            transition: .2s ease-in;
            cursor: pointer;
        }

        button:hover {
            background: #6d44b8;
        }

        .login {
            height: 460px;
            background: #24243e;
            border-radius: 60% / 10%;
            transform: translateY(-180px);
            transition: .8s ease-in-out;
        }

        .login label {
            color: #573b8a;
            transform: scale(.6);
        }

        #chk:checked ~ .login {
            transform: translateY(-500px);
        }

        #chk:checked ~ .login label {
            transform: scale(1);
        }

        #chk:checked ~ .signup label {
            transform: scale(.6);
        }

        .error, .signup-error {
            color: red;
            text-align: center;
            margin: 10px 0;
        }

        .google-signin {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        .g-signin2 {
            width: 100px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            const data = {
                id_token: response.credential
            };
            fetch('/google-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.error || 'Error al iniciar sesión con Google');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al iniciar sesión con Google');
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "{{ GOOGLE_CLIENT_ID }}",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("googleSignInButton"),
                { theme: "outline", size: "large" }
            );
        };
    </script>
</head>
<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">

        <div class="signup">
            <form method="POST" action="{{ url_for('register') }}">
                <label for="chk" aria-hidden="true">Registro</label>
                <input type="text" name="numero_documento" placeholder="Número de Documento" required>
                <input type="text" name="nombre_completo" placeholder="Nombre Completo" required>
                <input type="text" name="numero_contacto" placeholder="Número de Contacto" required>
                <input type="email" name="correo" placeholder="Correo" required>
                <select name="tipo_persona" style="width: 65%; height: 40px; margin: 20px auto; background: #e0dede; border: none; border-radius: 5px; padding: 10px;">
                    <option value="natural">Persona Natural</option>
                    <option value="juridica">Persona Jurídica</option>
                </select>
                <input type="password" name="password" placeholder="Contraseña" required>
                {% if signup_error %}
                    <p class="signup-error">{{ signup_error }}</p>
                {% endif %}
                <button type="submit">Registrar</button>
            </form>
        </div>

        <div class="login">
            <form method="POST" action="{{ url_for('login') }}">
                <label for="chk" aria-hidden="true">Iniciar Sesión</label>
                <input type="email" name="correo" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div class="google-signin">
                <div id="googleSignInButton" class="g-signin2"></div>
            </div>
        </div>
    </div>
</body>
</html>
